name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Unpack project
        run: unzip -o project.zip -d src_unpacked
      - name: Build
        run: gradle -p src_unpacked assembleDebug --no-daemon
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: URL Gallery build ${{ github.run_number }}
          files: src_unpacked/app/build/outputs/apk/debug/app-debug.apk
